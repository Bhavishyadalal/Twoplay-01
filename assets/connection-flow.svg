<svg width="640" height="190" viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif">
  <style>
    .pulse{animation:pulse 1.8s ease-in-out infinite;}
    .pulse2{animation:pulse 1.8s ease-in-out infinite .5s;}
    .flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite;}
    @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
    @keyframes dash{to{stroke-dashoffset:-24;}}
  </style>
  <rect width="640" height="190" fill="#FFF8EE"/>
  <circle class="pulse" cx="90" cy="95" r="34" fill="#FFE3F0" stroke="#FF6FA5" stroke-width="2"/>
  <text x="90" y="102" font-size="26" text-anchor="middle">🧑</text>
  <text x="90" y="150" font-size="13" text-anchor="middle" fill="#2B2440" font-weight="bold">You</text>
  <text x="90" y="166" font-size="11" text-anchor="middle" fill="#6B6180">code: 12345</text>

  <circle class="pulse2" cx="550" cy="95" r="34" fill="#E3E9FF" stroke="#6C8BFF" stroke-width="2"/>
  <text x="550" y="102" font-size="26" text-anchor="middle">🧑</text>
  <text x="550" y="150" font-size="13" text-anchor="middle" fill="#2B2440" font-weight="bold">Friend</text>
  <text x="550" y="166" font-size="11" text-anchor="middle" fill="#6B6180">enters 12345</text>

  <line class="flow" x1="128" y1="95" x2="512" y2="95" stroke="#A06CFF" stroke-width="3"/>
  <text x="320" y="75" font-size="13" text-anchor="middle" fill="#A06CFF" font-weight="bold">direct P2P data channel</text>
  <text x="320" y="118" font-size="11" text-anchor="middle" fill="#6B6180">moves · chat · draws · voice</text>
</svg>
