<svg width="440" height="100" viewBox="0 0 440 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card{animation:lift 2.4s ease-in-out infinite;transform-origin:65px 45px;}
    .icon{animation:spin 2.4s ease-in-out infinite;transform-origin:65px 45px;}
    @keyframes lift{0%,60%,100%{transform:translateY(0) rotate(0deg);}30%{transform:translateY(-5px) rotate(-1.5deg);}}
    @keyframes spin{0%,60%,100%{transform:scale(1) rotate(0deg);}30%{transform:scale(1.18) rotate(5deg);}}
  </style>
  <rect class="card" x="10" y="10" width="110" height="70" rx="16" fill="#FFF3E4" stroke="#A06CFF" stroke-width="2"/>
  <text class="icon" x="65" y="52" font-size="28" text-anchor="middle">♞</text>
  <text x="65" y="72" font-size="11" font-weight="800" text-anchor="middle" fill="#2B2440" font-family="Verdana, sans-serif">Chess</text>
  <text x="150" y="40" font-size="13" fill="#6B6180" font-family="Verdana, sans-serif">← this is the real in-app hover</text>
  <text x="150" y="60" font-size="13" fill="#6B6180" font-family="Verdana, sans-serif">animation — card lifts, icon spins,</text>
  <text x="150" y="80" font-size="13" fill="#6B6180" font-family="Verdana, sans-serif">looping here so you can see it.</text>
</svg>
